<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Dompet Keluarga - Rekening & Kas Harian</title>
<style>
  :root {
    --bg: #f3f6f4;
    --card: #ffffff;
    --text: #16221c;
    --muted: #64746b;
    --primary: #15803d;
    --primary-soft: #dcfce7;
    --daily: #0f766e;
    --daily-soft: #ccfbf1;
    --danger: #dc2626;
    --danger-soft: #fee2e2;
    --border: #e2e8e4;
    --shadow: 0 4px 16px rgba(22, 34, 28, 0.06);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding-bottom: 96px;
  }
  .container { max-width: 540px; margin: 0 auto; padding: 16px; }
  header {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 12px;
  }
  header h1 { font-size: 1.22rem; margin: 0; font-weight: 700; }
  header p { font-size: 0.76rem; color: var(--muted); margin: 2px 0 0; }
  .top-actions { display: flex; gap: 6px; }
  .btn-sm {
    border: 1px solid var(--border); background: var(--card); color: var(--text);
    padding: 7px 10px; border-radius: 10px; font-size: 0.76rem; font-weight: 600;
    cursor: pointer;
  }
  .btn-sm.danger { color: var(--danger); border-color: #fecaca; background: #fff5f5; }

  .wallet-switch {
    display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
    margin-bottom: 14px;
  }
  .wallet-pill {
    border: 1.5px solid var(--border); background: var(--card); color: var(--muted);
    padding: 10px 12px; border-radius: 14px; font-weight: 700; font-size: 0.85rem;
    cursor: pointer; text-align: center; transition: all 0.15s ease;
  }
  .wallet-pill span { display: block; font-size: 0.7rem; font-weight: 500; margin-top: 2px; opacity: 0.85; }
  .wallet-pill.active.main {
    background: var(--primary-soft); color: var(--primary); border-color: var(--primary);
  }
  .wallet-pill.active.daily {
    background: var(--daily-soft); color: var(--daily); border-color: var(--daily);
  }

  .balance-card {
    background: linear-gradient(135deg, #14532d 0%, #166534 55%, #15803d 100%);
    color: #fff; border-radius: 20px; padding: 18px 20px; box-shadow: var(--shadow);
    margin-bottom: 14px; transition: background 0.2s ease;
  }
  .balance-card.daily-theme {
    background: linear-gradient(135deg, #134e4a 0%, #115e59 55%, #0f766e 100%);
  }
  .balance-label { font-size: 0.8rem; opacity: 0.9; display: flex; justify-content: space-between; align-items: center; }
  .balance-amount { font-size: 1.8rem; font-weight: 800; margin: 4px 0 14px; letter-spacing: -0.5px; }
  .cashflow-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .cashflow-box {
    background: rgba(255,255,255,0.14); border-radius: 14px; padding: 10px 12px;
  }
  .cashflow-box span { font-size: 0.74rem; opacity: 0.9; display: block; }
  .cashflow-box strong { font-size: 0.96rem; font-weight: 700; margin-top: 2px; display: block; }

  .tabs {
    display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
    background: #e6ece8; padding: 4px; border-radius: 14px; margin-bottom: 12px;
  }
  .tab-btn {
    border: none; background: transparent; padding: 9px; border-radius: 11px;
    font-weight: 600; font-size: 0.84rem; color: var(--muted); cursor: pointer;
  }
  .tab-btn.active { background: var(--card); color: var(--text); box-shadow: 0 2px 6px rgba(0,0,0,0.06); }

  .filters {
    display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 14px;
  }
  select, input[type="date"], input[type="text"], input[type="number"] {
    width: 100%; padding: 11px 12px; border: 1px solid var(--border);
    border-radius: 12px; font-size: 0.88rem; background: var(--card); color: var(--text);
  }
  .tx-list { display: flex; flex-direction: column; gap: 10px; }
  .tx-item {
    background: var(--card); border-radius: 16px; padding: 13px 14px;
    display: flex; justify-content: space-between; align-items: center;
    box-shadow: 0 2px 8px rgba(0,0,0,0.03); border: 1px solid var(--border);
  }
  .tx-left { display: flex; flex-direction: column; gap: 3px; }
  .tx-cat { font-weight: 700; font-size: 0.92rem; }
  .tx-meta { font-size: 0.75rem; color: var(--muted); }
  .tx-right { display: flex; align-items: center; gap: 10px; }
  .tx-amt { font-weight: 700; font-size: 0.94rem; }
  .tx-amt.income { color: var(--primary); }
  .tx-amt.expense { color: var(--danger); }
  .del-btn {
    border: none; background: transparent; color: #94a3b8; font-size: 1rem;
    cursor: pointer; padding: 4px;
  }
  .card {
    background: var(--card); border-radius: 18px; padding: 16px;
    border: 1px solid var(--border); margin-bottom: 12px;
  }
  .bar-row { margin-bottom: 12px; }
  .bar-head { display: flex; justify-content: space-between; font-size: 0.84rem; margin-bottom: 5px; }
  .bar-track { height: 10px; background: #edf2ef; border-radius: 999px; overflow: hidden; }
  .bar-fill { height: 100%; background: var(--primary); border-radius: 999px; }
  .bar-fill.exp { background: #ef4444; }
  .fab {
    position: fixed; right: 20px; bottom: 22px;
    background: var(--primary); color: #fff; border: none;
    border-radius: 999px; padding: 14px 20px; font-size: 0.94rem; font-weight: 700;
    box-shadow: 0 10px 24px rgba(21, 128, 61, 0.35); cursor: pointer; z-index: 20;
  }
  .fab.daily-theme {
    background: var(--daily);
    box-shadow: 0 10px 24px rgba(15, 118, 110, 0.35);
  }
  .modal-backdrop {
    position: fixed; inset: 0; background: rgba(0,0,0,0.45);
    display: none; align-items: flex-end; justify-content: center; z-index: 50;
  }
  .modal-backdrop.open { display: flex; }
  .sheet {
    background: var(--card); width: 100%; max-width: 540px;
    border-radius: 24px 24px 0 0; padding: 20px 18px 28px;
    animation: slideUp 0.2s ease-out;
  }
  @keyframes slideUp { from { transform: translateY(40px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
  .sheet h2 { margin: 0 0 4px; font-size: 1.1rem; }
  .sheet-sub { font-size: 0.78rem; color: var(--muted); margin: 0 0 14px; }
  .type-toggle { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
  .type-opt {
    padding: 10px; border-radius: 12px; border: 1px solid var(--border);
    text-align: center; font-weight: 700; font-size: 0.88rem; cursor: pointer; background: var(--bg);
  }
  .type-opt.active.inc { background: var(--primary-soft); color: var(--primary); border-color: var(--primary); }
  .type-opt.active.exp { background: var(--danger-soft); color: var(--danger); border-color: var(--danger); }
  .form-group { margin-bottom: 12px; }
  .form-group label { display: block; font-size: 0.78rem; color: var(--muted); margin-bottom: 4px; font-weight: 600; }
  .submit-btn {
    width: 100%; padding: 13px; border: none; border-radius: 14px;
    background: var(--primary); color: #fff; font-weight: 700; font-size: 0.98rem;
    cursor: pointer; margin-top: 6px;
  }
  .submit-btn.daily-theme { background: var(--daily); }
  .empty { text-align: center; color: var(--muted); padding: 32px 12px; font-size: 0.88rem; }
</style>
</head>
<body>
<div class="container">
  <header>
    <div>
      <h1>Dompet Keluarga</h1>
      <p>Rekening utama & pecahan kas harian</p>
    </div>
    <div class="top-actions">
      <button class="btn-sm" onclick="exportCSV()">Ekspor CSV</button>
      <button class="btn-sm danger" onclick="resetCurrentWallet()">Reset</button>
    </div>
  </header>

  <div class="wallet-switch">
    <button class="wallet-pill active main" id="btnWalletMain" onclick="switchWallet('main')">
      🏦 Rekening Utama
      <span>Gaji, tagihan & pos besar</span>
    </button>
    <button class="wallet-pill" id="btnWalletDaily" onclick="switchWallet('daily')">
      🪙 Kas Harian
      <span>Jajan, sayur & recehan harian</span>
    </button>
  </div>

  <section class="balance-card" id="balanceCard">
    <div class="balance-label">
      <span id="saldoTitle">Sisa Saldo Rekening</span>
    </div>
    <div class="balance-amount" id="saldoDisplay">Rp 0</div>
    <div class="cashflow-grid">
      <div class="cashflow-box">
        <span id="incLabel">Pemasukan</span>
        <strong id="pemasukanDisplay">Rp 0</strong>
      </div>
      <div class="cashflow-box">
        <span id="expLabel">Pengeluaran</span>
        <strong id="pengeluaranDisplay">Rp 0</strong>
      </div>
    </div>
  </section>

  <div class="tabs">
    <button class="tab-btn active" id="tabRiwayat" onclick="switchTab('riwayat')">Riwayat</button>
    <button class="tab-btn" id="tabPorsi" onclick="switchTab('porsi')">Porsi Pengeluaran</button>
  </div>

  <div class="filters">
    <select id="filterBulan" onchange="render()">
      <option value="all">Semua Bulan</option>
    </select>
    <select id="filterKategori" onchange="render()">
      <option value="all">Semua Kategori</option>
    </select>
  </div>

  <div id="viewRiwayat" class="tx-list"></div>
  <div id="viewPorsi" style="display:none;"></div>
</div>

<button class="fab" id="fabBtn" onclick="openModal()">+ Catat Rekening</button>

<div class="modal-backdrop" id="modalBackdrop" onclick="closeModalBackdrop(event)">
  <div class="sheet">
    <h2 id="modalTitle">Tambah Transaksi Rekening</h2>
    <p class="sheet-sub" id="modalSub">Catat pemasukan gaji atau pos pengeluaran utama</p>
    <div class="type-toggle">
      <div class="type-opt active exp" id="optExpense" onclick="setType('expense')">Pengeluaran</div>
      <div class="type-opt inc" id="optIncome" onclick="setType('income')">Pemasukan / Uang Pegangan</div>
    </div>
    <div class="form-group">
      <label>Nominal (Rp)</label>
      <input type="text" id="inputNominal" inputmode="numeric" placeholder="Contoh: 25.000" oninput="formatNominalInput(this)">
    </div>
    <div class="form-group">
      <label>Kategori</label>
      <select id="inputKategori"></select>
    </div>
    <div class="form-group">
      <label>Tanggal</label>
      <input type="date" id="inputTanggal">
    </div>
    <div class="form-group">
      <label>Catatan (Opsional)</label>
      <input type="text" id="inputCatatan" placeholder="Contoh: Beli sayur, kopi, bensin motor">
    </div>
    <button class="submit-btn" id="submitBtn" onclick="saveTx()">Simpan Catatan</button>
  </div>
</div>

<script>
const STORAGE_KEY = 'dompet_keluarga_v2';
const LEGACY_KEY = 'dompet_keluarga_v1';

const WALLET_CONFIG = {
  main: {
    name: 'Rekening Utama',
    saldoTitle: 'Sisa Saldo Rekening',
    incLabel: 'Pemasukan',
    expLabel: 'Pengeluaran',
    fabText: '+ Catat Rekening',
    modalTitle: 'Transaksi Rekening Utama',
    modalSub: 'Catat gaji, tagihan rutin, atau transfer uang pegangan',
    categories: {
      income: ['Gaji Utama', 'Bonus / Tunjangan', 'Usaha / Sampingan', 'Pemasukan Lain'],
      expense: ['Transfer ke Kas Harian', 'Belanja Bulanan', 'Listrik, Air & Internet', 'Cicilan / Tagihan', 'Kesehatan', 'Anak & Pendidikan', 'Dana Darurat / Tabungan', 'Kebutuhan Besar Lain']
    }
  },
  daily: {
    name: 'Kas Harian',
    saldoTitle: 'Sisa Uang Pegangan Harian',
    incLabel: 'Uang Pegangan Masuk',
    expLabel: 'Belanja Harian',
    fabText: '+ Catat Harian',
    modalTitle: 'Catatan Kas Harian',
    modalSub: 'Catat pengeluaran kecil sehari-hari agar tidak bocor halus',
    categories: {
      income: ['Terima dari Rekening', 'Sisa Kembalian / Tunai', 'Pemasukan Kecil Lain'],
      expense: ['Sayur & Lauk Harian', 'Jajan / Kopi / Camilan', 'Makan di Luar / Bungkus', 'Bensin Motor & Parkir', 'Galon & Gas LPG', 'Kebutuhan Mendadak', 'Sedekah / Infaq', 'Pengeluaran Kecil Lain']
    }
  }
};

let transactions = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null');
if (!transactions) {
  const oldTx = JSON.parse(localStorage.getItem(LEGACY_KEY) || '[]');
  transactions = oldTx.map(t => ({ ...t, wallet: 'main' }));
  if (transactions.length) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(transactions));
  }
}

let currentWallet = 'main';
let currentType = 'expense';
let currentTab = 'riwayat';

function formatRupiah(num) {
  return 'Rp ' + Math.round(num || 0).toString().replace(/\B(?=(\d{3})+(?!\d))/g, '.');
}

function formatNominalInput(el) {
  const digits = el.value.replace(/\D/g, '');
  el.value = digits ? digits.replace(/\B(?=(\d{3})+(?!\d))/g, '.') : '';
}

function parseNominal(str) {
  const n = parseInt((str || '').replace(/\D/g, ''), 10);
  return isNaN(n) ? 0 : n;
}

function switchWallet(wallet) {
  currentWallet = wallet;
  const cfg = WALLET_CONFIG[wallet];

  document.getElementById('btnWalletMain').className = 'wallet-pill' + (wallet === 'main' ? ' active main' : '');
  document.getElementById('btnWalletDaily').className = 'wallet-pill' + (wallet === 'daily' ? ' active daily' : '');

  const card = document.getElementById('balanceCard');
  const fab = document.getElementById('fabBtn');
  const submit = document.getElementById('submitBtn');

  if (wallet === 'daily') {
    card.classList.add('daily-theme');
    fab.classList.add('daily-theme');
    submit.classList.add('daily-theme');
  } else {
    card.classList.remove('daily-theme');
    fab.classList.remove('daily-theme');
    submit.classList.remove('daily-theme');
  }

  document.getElementById('saldoTitle').textContent = cfg.saldoTitle;
  document.getElementById('incLabel').textContent = cfg.incLabel;
  document.getElementById('expLabel').textContent = cfg.expLabel;
  fab.textContent = cfg.fabText;

  populateFilters();
  render();
}

function setType(type) {
  currentType = type;
  const cfg = WALLET_CONFIG[currentWallet];
  document.getElementById('optExpense').className = 'type-opt' + (type === 'expense' ? ' active exp' : '');
  document.getElementById('optIncome').className = 'type-opt' + (type === 'income' ? ' active inc' : '');
  const sel = document.getElementById('inputKategori');
  sel.innerHTML = cfg.categories[type].map(c => `<option value="${c}">${c}</option>`).join('');
}

function openModal() {
  const cfg = WALLET_CONFIG[currentWallet];
  document.getElementById('modalTitle').textContent = cfg.modalTitle;
  document.getElementById('modalSub').textContent = cfg.modalSub;
  setType('expense');
  document.getElementById('inputNominal').value = '';
  document.getElementById('inputTanggal').value = new Date().toISOString().slice(0, 10);
  document.getElementById('inputCatatan').value = '';
  document.getElementById('inputCatatan').placeholder = currentWallet === 'daily'
    ? 'Contoh: Sayur bayam, kopi, parkir, galon'
    : 'Contoh: Gaji bulanan, listrik, transfer kas harian';

  document.getElementById('modalBackdrop').classList.add('open');
}

function closeModalBackdrop(e) {
  if (e.target.id === 'modalBackdrop') {
    document.getElementById('modalBackdrop').classList.remove('open');
  }
}

function saveTx() {
  const nominal = parseNominal(document.getElementById('inputNominal').value);
  const kategori = document.getElementById('inputKategori').value;
  const tanggal = document.getElementById('inputTanggal').value || new Date().toISOString().slice(0, 10);
  const catatan = document.getElementById('inputCatatan').value.trim();

  if (nominal <= 0) {
    alert('Masukkan nominal yang valid terlebih dahulu.');
    return;
  }

  transactions.unshift({
    id: Date.now(),
    wallet: currentWallet,
    type: currentType,
    amount: nominal,
    category: kategori,
    date: tanggal,
    note: catatan
  });

  localStorage.setItem(STORAGE_KEY, JSON.stringify(transactions));
  document.getElementById('modalBackdrop').classList.remove('open');
  populateFilters();
  render();
}

function deleteTx(id) {
  transactions = transactions.filter(t => t.id !== id);
  localStorage.setItem(STORAGE_KEY, JSON.stringify(transactions));
  populateFilters();
  render();
}

function resetCurrentWallet() {
  const walletTx = transactions.filter(t => (t.wallet || 'main') === currentWallet);
  if (!walletTx.length) return;
  const label = WALLET_CONFIG[currentWallet].name;
  if (confirm(`Hapus semua catatan di ${label}?`)) {
    transactions = transactions.filter(t => (t.wallet || 'main') !== currentWallet);
    localStorage.setItem(STORAGE_KEY, JSON.stringify(transactions));
    populateFilters();
    render();
  }
}

function switchTab(tab) {
  currentTab = tab;
  document.getElementById('tabRiwayat').className = 'tab-btn' + (tab === 'riwayat' ? ' active' : '');
  document.getElementById('tabPorsi').className = 'tab-btn' + (tab === 'porsi' ? ' active' : '');
  document.getElementById('viewRiwayat').style.display = tab === 'riwayat' ? 'flex' : 'none';
  document.getElementById('viewPorsi').style.display = tab === 'porsi' ? 'block' : 'none';
  render();
}

function populateFilters() {
  const walletTx = transactions.filter(t => (t.wallet || 'main') === currentWallet);
  const monthSel = document.getElementById('filterBulan');
  const prevMonth = monthSel.value;
  const months = [...new Set(walletTx.map(t => (t.date || '').slice(0, 7)).filter(Boolean))].sort().reverse();
  monthSel.innerHTML = '<option value="all">Semua Bulan</option>' +
    months.map(m => `<option value="${m}">${m}</option>`).join('');
  if (months.includes(prevMonth)) monthSel.value = prevMonth;

  const catSel = document.getElementById('filterKategori');
  const prevCat = catSel.value;
  const cfg = WALLET_CONFIG[currentWallet];
  const allCats = [...cfg.categories.income, ...cfg.categories.expense];
  catSel.innerHTML = '<option value="all">Semua Kategori</option>' +
    allCats.map(c => `<option value="${c}">${c}</option>`).join('');
  if (allCats.includes(prevCat)) catSel.value = prevCat;
}

function getFiltered() {
  const m = document.getElementById('filterBulan').value;
  const c = document.getElementById('filterKategori').value;
  return transactions.filter(t => {
    const okW = (t.wallet || 'main') === currentWallet;
    const okM = m === 'all' || (t.date || '').startsWith(m);
    const okC = c === 'all' || t.category === c;
    return okW && okM && okC;
  });
}

function render() {
  const list = getFiltered();
  const inc = list.filter(t => t.type === 'income').reduce((s, t) => s + t.amount, 0);
  const exp = list.filter(t => t.type === 'expense').reduce((s, t) => s + t.amount, 0);

  document.getElementById('pemasukanDisplay').textContent = formatRupiah(inc);
  document.getElementById('pengeluaranDisplay').textContent = formatRupiah(exp);
  document.getElementById('saldoDisplay').textContent = formatRupiah(inc - exp);

  if (currentTab === 'riwayat') {
    const container = document.getElementById('viewRiwayat');
    if (!list.length) {
      const hint = currentWallet === 'daily'
        ? 'Belum ada catatan harian. Tekan <b>+ Catat Harian</b> untuk mencatat jajan, sayur, atau bensin.'
        : 'Belum ada catatan rekening. Tekan <b>+ Catat Rekening</b> untuk memulai.';
      container.innerHTML = `<div class="empty">${hint}</div>`;
      return;
    }
    container.innerHTML = list.map(t => `
      <div class="tx-item">
        <div class="tx-left">
          <div class="tx-cat">${t.category}</div>
          <div class="tx-meta">${t.date}${t.note ? ' • ' + t.note : ''}</div>
        </div>
        <div class="tx-right">
          <div class="tx-amt ${t.type}">${t.type === 'income' ? '+' : '-'}${formatRupiah(t.amount)}</div>
          <button class="del-btn" onclick="deleteTx(${t.id})" title="Hapus">✕</button>
        </div>
      </div>
    `).join('');
  } else {
    const porsiEl = document.getElementById('viewPorsi');
    const expItems = list.filter(t => t.type === 'expense');
    const ratio = inc > 0 ? Math.round((exp / inc) * 100) : 0;

    let html = `<div class="card">
      <div style="font-size:0.84rem;color:var(--muted);">Rasio Pengeluaran (${WALLET_CONFIG[currentWallet].name})</div>
      <div style="font-size:1.35rem;font-weight:800;margin-top:4px;">${inc > 0 ? ratio + '%' : 'Belum ada pemasukan'}</div>
    </div>`;

    if (!expItems.length) {
      html += '<div class="card"><div class="empty" style="padding:14px;">Belum ada data pengeluaran untuk dihitung porsinya.</div></div>';
    } else {
      const grouped = {};
      expItems.forEach(t => { grouped[t.category] = (grouped[t.category] || 0) + t.amount; });
      const sorted = Object.entries(grouped).sort((a, b) => b[1] - a[1]);
      html += '<div class="card">' + sorted.map(([cat, amt]) => {
        const pct = exp > 0 ? Math.round((amt / exp) * 100) : 0;
        return `<div class="bar-row">
          <div class="bar-head"><span><b>${cat}</b> (${pct}%)</span><span>${formatRupiah(amt)}</span></div>
          <div class="bar-track"><div class="bar-fill exp" style="width:${pct}%"></div></div>
        </div>`;
      }).join('') + '</div>';
    }
    porsiEl.innerHTML = html;
  }
}

function exportCSV() {
  if (!transactions.length) {
    alert('Belum ada data untuk diekspor.');
    return;
  }
  const rows = [['Dompet', 'Tanggal', 'Jenis', 'Kategori', 'Nominal', 'Catatan']];
  transactions.forEach(t => {
    const wName = (t.wallet || 'main') === 'daily' ? 'Kas Harian' : 'Rekening Utama';
    rows.push([
      wName,
      t.date,
      t.type === 'income' ? 'Pemasukan' : 'Pengeluaran',
      t.category,
      t.amount,
      '"' + (t.note || '').replace(/"/g, '""') + '"'
    ]);
  });
  const csv = rows.map(r => r.join(',')).join('\n');
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'dompet-keluarga-lengkap.csv';
  a.click();
  URL.revokeObjectURL(url);
}
